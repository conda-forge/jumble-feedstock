context:
  version: "0.2"
  build_number: 2

package:
  name: jumble
  version: ${{ version }}

source:
  url: https://github.com/lguez/Jumble/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 5483b68a5a184e0fc074de98d6fd22b9feab43d203137007da947b73ab04fc49

build:
  skip:
    - win
  number: ${{ build_number }}
  string: gfortran${{ fortran_compiler_version }}_h${{ hash }}_${{ build_number }}

requirements:
  build:
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cmake
    - make
  run_constraints:
    # gfortran 15 changed the .mod format; older gfortran cannot read it.
    - if: match(fortran_compiler_version, ">=15")
      then: gfortran_impl_${{ target_platform }} >=15
  run_exports:
    - ${{ pin_subpackage("jumble", upper_bound="x.x.x") }}

tests:
  - package_contents:
      lib:
        - jumble
      include:
        - jumble.mod
  - script: tests/consumer.sh
    requirements:
      build:
        - ${{ compiler('fortran') }}
  - if: match(fortran_compiler_version, "14.*")
    then:
      script: tests/consumer.sh
      requirements:
        build:
          - gfortran_${{ target_platform }} 13.*
  - if: match(fortran_compiler_version, "14.*")
    then:
      script: tests/consumer.sh
      requirements:
        build:
          - gfortran_${{ target_platform }} 15.*

about:
  homepage: https://github.com/lguez/Jumble
  summary: 'A library of various utilities in Fortran 2003'
  description: |
    Jumble is a library of various utilities in Fortran 2003, basic
    mathematical constants and basic procedures for numerical tasks.
  license: GPL-3.0-only AND BSD-2-Clause
  license_file:
    - LICENSE
    - iso_varying_string.f90
  documentation: https://lguez.github.io/Jumble

extra:
  recipe-maintainers:
    - lguez
