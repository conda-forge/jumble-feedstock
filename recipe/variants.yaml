# Keep the compiler versions aligned with the global compiler zip_keys.
# macOS uses Clang for C/C++ alongside both gfortran variants.
fortran_compiler_version:
  - "14"
  - "15"
c_compiler_version:
  - if: linux
    then: "14"
    else: "21"
  - if: linux
    then: "15"
    else: "21"
cxx_compiler_version:
  - if: linux
    then: "14"
    else: "21"
  - if: linux
    then: "15"
    else: "21"
